<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cargando reporte… · Walmart</title>
  <style>
    :root {
      --wm-blue: #0053e2;
      --wm-blue-dark: #003eb3;
      --wm-spark: #ffc220;
      --wm-text: #1a1a1a;
      --wm-subtle: #64748b;
      --wm-border: #cbd5e1;
      --wm-bg: #f8fafc;
      --wm-error-bg: #fef2f2;
      --wm-error-border: #fecaca;
      --wm-error-text: #991b1b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--wm-bg);
      color: var(--wm-text);
    }
    .loader {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      color: var(--wm-blue); gap: 14px; padding: 20px;
    }
    .loader .spark-bar {
      width: 80px; height: 4px; background: var(--wm-spark);
      border-radius: 2px; margin-bottom: 8px;
    }
    .loader .spinner {
      width: 56px; height: 56px;
      border: 5px solid var(--wm-border); border-top-color: var(--wm-blue);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    .loader .label { font-size: 18px; font-weight: 600; }
    .loader .detail {
      font-size: 12px; color: var(--wm-subtle);
      font-family: 'Consolas', 'Cascadia Code', monospace;
      max-width: 600px; text-align: center; word-break: break-all; min-height: 16px;
    }
    .badge {
      position: fixed; bottom: 12px; right: 16px; font-size: 10px;
      color: var(--wm-subtle); font-family: 'Consolas', monospace; opacity: .6;
      z-index: 10;
    }
    .error {
      max-width: 720px; margin: 60px auto; padding: 28px;
      background: var(--wm-error-bg); border: 1px solid var(--wm-error-border);
      border-radius: 8px; color: var(--wm-error-text);
      font-size: 14px; line-height: 1.6;
    }
    .error h1 { margin-top: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .error .tip {
      background: #fff7ed; border-left: 4px solid var(--wm-spark);
      padding: 10px 14px; margin-top: 14px; border-radius: 4px; color: #7c2d12;
    }
    .error pre {
      background: #fff; padding: 12px; border-radius: 4px; font-size: 11px;
      margin-top: 8px; overflow: auto; max-height: 280px;
      white-space: pre-wrap; word-break: break-all; border: 1px solid #fecaca;
    }
    .error .actions { margin-top: 18px; display: flex; gap: 8px; }
    .error button {
      padding: 10px 18px; background: var(--wm-blue); color: #fff; border: none;
      border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .error button:hover { background: var(--wm-blue-dark); }
    .error button.secondary {
      background: #fff; color: var(--wm-text); border: 1px solid var(--wm-border);
    }
    /* iframe aislado donde se renderiza el reporte (sandbox sin same-origin) */
    #report-frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: none; background: #fff; display: none; z-index: 5;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media print { .badge { display: none; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="loader">
      <div class="spark-bar" aria-hidden="true"></div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="label" id="status">Iniciando…</div>
      <div class="detail" id="detail"></div>
    </div>
    <div class="badge">v19 · GitHub Pages · Sandbox aislado · Walmart 🐶</div>
  </div>

  <script>
  /*
   * VIEWER · Imprimir Reporte Walmart — GITHUB PAGES ENDURECIDO (v19)
   *
   * Hosteado en GitHub Pages PÚBLICO. GitHub Pages sirve el HTML directo, por
   * lo que window.location.hash funciona nativo (1 click). A diferencia de la
   * v18, esta versión NO ejecuta el reporte con document.write (que correría
   * con el origen del sitio). En su lugar, renderiza el reporte dentro de un
   * IFRAME SANDBOXED sin allow-same-origin → el contenido del reporte queda
   * AISLADO y no puede acceder al origen, cookies ni storage del sitio.
   *
   * MITIGACIÓN DE SEGURIDAD (importante para repo público):
   *   - El reporte se inyecta vía iframe.srcdoc con sandbox="allow-scripts
   *     allow-modals allow-popups". SIN allow-same-origin → origin "null".
   *   - Aunque un atacante fabrique una URL con JS malicioso en el #hash, ese
   *     JS corre aislado: no puede leer el origen del sitio, ni robar sesión,
   *     ni acceder a otras pestañas. Solo puede pintar e imprimir su propio
   *     contenido dentro del iframe.
   *   - allow-scripts + allow-modals son necesarios para que el window.print()
   *     del reporte funcione.
   *
   * PRIVACIDAD: el #hash NUNCA se envía al servidor (RFC 3986). GitHub no ve
   * ni almacena los datos. Todo el procesamiento ocurre en el navegador.
   *
   * Este archivo NO contiene datos — solo lógica de decodificación y render.
   */
  (function () {
    "use strict";

    var statusEl = document.getElementById("status");
    var detailEl = document.getElementById("detail");

    function setStatus(msg, detail) {
      if (statusEl) statusEl.textContent = msg;
      if (detailEl) detailEl.textContent = detail || "";
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>'"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c];
      });
    }

    function showError(title, detail, tip, technical) {
      var root = document.getElementById("root");
      root.innerHTML = "";
      var div = document.createElement("div");
      div.className = "error";
      var html = "<h1>⚠️ " + escapeHtml(title) + "</h1><p>" + escapeHtml(detail) + "</p>";
      if (tip) html += "<div class='tip'><strong>💡 Sugerencia:</strong> " + escapeHtml(tip) + "</div>";
      if (technical) html += "<p><strong>Detalle técnico:</strong></p><pre>" + escapeHtml(technical) + "</pre>";
      html += "<div class='actions'>" +
              "<button onclick='window.close()'>Cerrar pestaña</button>" +
              "<button class='secondary' onclick='location.reload()'>Reintentar</button></div>";
      div.innerHTML = html;
      root.appendChild(div);
    }

    function nextTick() { return new Promise(function (r) { setTimeout(r, 0); }); }
    function fmtKb(n) { return (n / 1024).toFixed(0) + " KB"; }

    function base64ToBytes(b64) {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    function decodeBase64Utf8(b64) {
      return new TextDecoder("utf-8").decode(base64ToBytes(b64));
    }
    async function decompressGzip(bytes) {
      var ds = new DecompressionStream("gzip");
      var stream = new Blob([bytes]).stream().pipeThrough(ds);
      var buf = await new Response(stream).arrayBuffer();
      return new TextDecoder("utf-8").decode(buf);
    }

    function tipForSize(kb) {
      if (kb > 1800) return "El reporte excede 1.8 MB — el navegador o Power BI pueden truncar la URL. Aplica filtros para reducir productos.";
      if (kb > 1500) return "El reporte está cerca del límite (1.5–1.8 MB). Si falla, aplica más filtros.";
      return null;
    }

    /**
     * Renderiza el HTML del reporte DENTRO de un iframe sandboxed sin
     * allow-same-origin. El reporte queda aislado del origen del sitio.
     */
    function renderInSandbox(html) {
      var frame = document.createElement("iframe");
      frame.id = "report-frame";
      // Sandbox SIN allow-same-origin: el contenido corre en origin "null",
      // aislado del sitio. allow-scripts + allow-modals para que window.print
      // del reporte funcione. allow-popups por si el reporte abre algo.
      frame.setAttribute("sandbox", "allow-scripts allow-modals allow-popups");
      frame.setAttribute("srcdoc", html);
      document.body.appendChild(frame);
      frame.style.display = "block";

      // Disparar impresión: el reporte tiene su propio printScript, pero como
      // respaldo intentamos imprimir el iframe cuando termina de cargar.
      frame.addEventListener("load", function () {
        setTimeout(function () {
          try {
            if (frame.contentWindow) {
              frame.contentWindow.focus();
              frame.contentWindow.print();
            }
          } catch (_) { /* el printScript del reporte se encarga */ }
        }, 600);
      });
    }

    async function process() {
      try {
        setStatus("Leyendo URL…", "");
        await nextTick();

        var hash = window.location.hash || "";
        if (!hash || hash.length < 2) {
          showError(
            "No hay datos para mostrar",
            "Esta URL debe abrirse desde el visual de Power BI 'Imprimir Reporte Walmart'.",
            "Regresa a Power BI y haz clic en el botón 'Imprimir Reporte'."
          );
          return;
        }

        var payload = hash.substring(1);
        if (payload.indexOf("data=") === 0) payload = payload.substring(5);

        setStatus("URL recibida", "Payload: " + fmtKb(payload.length));
        await nextTick();

        setStatus("Decodificando URL…", fmtKb(payload.length) + " (puede tardar unos segundos)");
        await nextTick();

        var urlDecoded;
        try {
          urlDecoded = decodeURIComponent(payload);
        } catch (e) {
          showError(
            "Error al decodificar la URL",
            "El payload contiene caracteres URL-encoded inválidos. Probablemente el navegador truncó la URL.",
            tipForSize(payload.length / 1024) || "Intenta actualizar Power BI y vuelve a intentarlo.",
            "Tamaño recibido: " + fmtKb(payload.length) +
            "\n\nPrimeros 200 chars:\n" + payload.substring(0, 200) +
            "\n\nÚltimos 200 chars:\n" + payload.substring(payload.length - 200) +
            "\n\nError: " + e.message
          );
          return;
        }

        var html;
        if (urlDecoded.indexOf("gz:") === 0) {
          setStatus("Descomprimiendo reporte…", "");
          await nextTick();
          try {
            html = await decompressGzip(base64ToBytes(urlDecoded.substring(3)));
          } catch (e) {
            showError(
              "Error al descomprimir el reporte",
              "No se pudo descomprimir el contenido (gzip). Probable truncamiento del navegador o navegador sin soporte.",
              tipForSize(urlDecoded.length / 1024) || "Intenta actualizar Power BI y vuelve a intentarlo.",
              "Error: " + e.message
            );
            return;
          }
        } else {
          setStatus("Decodificando base64…", "");
          await nextTick();
          try {
            html = decodeBase64Utf8(urlDecoded);
          } catch (e) {
            showError(
              "Error al decodificar base64",
              "El payload no es base64 válido. Probable truncamiento del navegador.",
              tipForSize(urlDecoded.length / 1024) || "Intenta actualizar Power BI y vuelve a intentarlo.",
              "Tamaño base64: " + fmtKb(urlDecoded.length) +
              "\n\nPrimeros 200 chars:\n" + urlDecoded.substring(0, 200) +
              "\n\nÚltimos 200 chars:\n" + urlDecoded.substring(urlDecoded.length - 200) +
              "\n\nError: " + e.message
            );
            return;
          }
        }

        if (!html || html.indexOf("<") === -1) {
          showError(
            "El reporte no es válido",
            "Los datos decodificados no parecen un reporte. Probable truncamiento.",
            "Aplica filtros en Power BI para reducir el tamaño e intenta de nuevo."
          );
          return;
        }

        setStatus("Reporte decodificado", "Renderizando " + fmtKb(html.length) + "…");
        await nextTick();

        // Ocultar loader y renderizar en sandbox aislado
        var loader = document.querySelector(".loader");
        if (loader) loader.style.display = "none";
        renderInSandbox(html);

      } catch (e) {
        showError(
          "Error inesperado",
          "Ocurrió un error procesando el reporte.",
          "Intenta actualizar la pestaña o regresa a Power BI.",
          (e && e.stack) || String(e)
        );
      }
    }

    process();
  })();
  </script>
</body>
</html>
